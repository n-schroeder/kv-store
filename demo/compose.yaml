# Five-node cluster used by demo/election-demo.sh.
# No ports are published to the host; nodes only talk to each other.
name: kv-election-demo

x-node: &node
  image: kv-election-demo
  build:
    context: ..

services:
  node1:
    <<: *node
    environment:
      PEERS: node2:7878,node3:7878,node4:7878,node5:7878
  node2:
    <<: *node
    environment:
      PEERS: node1:7878,node3:7878,node4:7878,node5:7878
  node3:
    <<: *node
    environment:
      PEERS: node1:7878,node2:7878,node4:7878,node5:7878
  node4:
    <<: *node
    environment:
      PEERS: node1:7878,node2:7878,node3:7878,node5:7878
  node5:
    <<: *node
    environment:
      PEERS: node1:7878,node2:7878,node3:7878,node4:7878

networks:
  default:
    name: kv-election-demo
